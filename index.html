/* Ghost Diving Korea interface */
:root{--gdk-orange:#b94c16;--gdk-wash:#fff2e7;--gdk-ink:#242a2e;--gdk-muted:#665c54;--gdk-border:#e6dcd3}
body{margin:0;background:#faf8f5;color:var(--gdk-ink)}
.toolbar{padding:14px clamp(14px,3vw,40px);background:#fff;border-top:4px solid var(--gdk-orange);border-bottom:1px solid var(--gdk-border)}
.toolbar b{color:var(--gdk-ink);font-size:17px}
button{min-height:38px;background:var(--gdk-orange);color:white;border-radius:8px;padding:8px 13px;font-weight:650}
button.secondary{background:#fff4eb;color:#8c3914;border:1px solid #ead5c4}
button:disabled{opacity:.45}
.tabs{gap:6px;border-bottom:1px solid var(--gdk-border);padding-bottom:8px}
.tabs button{background:transparent;color:var(--gdk-muted)}
.tabs button.active{background:var(--gdk-orange);color:white}
.settings{background:#fff;padding:18px;border:1px solid var(--gdk-border);border-radius:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px}
.settings label{display:grid;gap:6px;color:var(--gdk-muted);font-size:13px;font-weight:650;min-width:0}
.settings input,.standalone-field,.annual-tools select,.settlement-export select{box-sizing:border-box;width:100%;min-width:0;padding:8px 10px;border:1px solid #d9cbbf;border-radius:7px;background:#fff;color:var(--gdk-ink);min-height:38px}
.annual-tools select,.settlement-export select{width:auto}
.paper{border:1px solid var(--gdk-border);border-radius:14px;box-shadow:none;background:#fff;color:var(--gdk-ink)}
.brand,.group-title{color:var(--gdk-orange)}
.hero article,.countcards article,.annual-metrics article{background:#fffaf6;border:1px solid var(--gdk-border);border-top:3px solid #e78d59;color:var(--gdk-ink)}
.hero strong{color:var(--gdk-ink)}
th,.guest-grid th,.waste-panel th,.money-table th{background:#34434a;color:#fff}
tbody tr:nth-child(even),.average-row td,.waste-panel,.team-card,.team-sheet>header,.settlement-account,.guide{background:#faf6f1}
tfoot td,.support-input,.money-summary .compact-money-final{background:var(--gdk-wash);color:#803913}
.project-grid input:not([readonly]),.team-table input,.room-table input,.money-table input:not([readonly]),.project-grid select,.team-table select,.room-table select,.waste-panel input{box-sizing:border-box;min-height:32px;border:1px solid #e6dcd3;border-radius:5px;background:#fff;color:var(--gdk-ink)}
.project-grid input[readonly],.money-table input[readonly]{background:#f4f1ec;color:#635b53}
textarea{box-sizing:border-box;border:1px solid #d9cbbf;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gdk-orange);outline-offset:2px}
.expense-line-scroll{scrollbar-color:#cc9d7e #f6eee7}
.expense-cell{padding:12px 8px}
.expense-cell .expense-name{border-bottom:1px solid var(--gdk-border);margin-bottom:7px;text-align:left}
.expense-cell .split-count{margin-top:6px}
.expense-cell .split-share{display:block;padding:6px 4px;background:var(--gdk-wash);border-radius:4px;font-variant-numeric:tabular-nums}
.expense-setting-grid section,.money-section{border-color:var(--gdk-border)}
.settlement-export{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
@media(max-width:700px){.settings{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .actions{flex-wrap:wrap}.tabs{flex-wrap:nowrap;overflow:auto}.tabs button{flex:none}.paper[data-view="money"]{min-width:0}.paper[data-view="money"] .hero{grid-template-columns:repeat(2,minmax(0,1fr))}.expense-setting-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.countcards .rental-summary strong{font-size:14px;line-height:1.5;font-weight:650}

.settlement-roster .roster-group+.roster-group{border-top:1px solid var(--gdk-border)}
.settlement-roster h3{min-width:92px;margin:0;font-size:14px;color:var(--gdk-ink)}
.settlement-roster h3 span{color:var(--gdk-orange)}
